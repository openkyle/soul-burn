name: Release Foundry Module

on:
  push:
    branches: [main]
    paths: [module.json]
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read module version
        run: echo "MODULE_VERSION=$(node -p "require('./module.json').version")" >> "$GITHUB_ENV"

      - name: Verify module
        run: |
          node --check scripts/soul-burn.js
          node --test tests/*.test.cjs

      - name: Build module archive
        run: |
          mkdir -p dist/soul-burn
          cp module.json LICENSE README.md CHANGELOG.md dist/soul-burn/
          cp -R scripts styles templates sounds packs icons dist/soul-burn/
          cd dist
          zip -r soul-burn.zip soul-burn
          cp ../module.json module.json

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.MODULE_VERSION }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: |
            dist/module.json
            dist/soul-burn.zip
          generate_release_notes: true
